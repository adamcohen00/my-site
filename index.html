<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px 16px;
    }
    main { max-width: 560px; }
    h1 { font-size: 2.2rem; margin: 0 0 .25em; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 1.5em; }
    a { color: var(--accent); }
    .badge {
      display: inline-block; font-size: .8rem; padding: 2px 10px; border-radius: 999px;
      border: 1px solid var(--muted); color: var(--muted); margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Published with GitHub Pages</span>
    <h1>Hello, world.</h1>
    <p>This site is live. It's a starter page and will be replaced with real content soon.</p>
  </main>
</body>
</html>
